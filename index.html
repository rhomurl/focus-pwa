<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="theme-color" content="#1a1a1e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Focus</title>
<style>
:root{--bg:#1a1a1e;--card:#26262c;--fg:#f2f2f4;--dim:#8e8e98;--acc:#e84a3c}
@media(prefers-color-scheme:light){:root{--bg:#f4f4f6;--card:#fff;--fg:#1a1a1e;--dim:#6c6c76}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px -apple-system,system-ui,sans-serif;min-height:100dvh;
 padding:env(safe-area-inset-top) 16px calc(70px + env(safe-area-inset-bottom))}
section{display:none;padding-top:24px}section.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--dim);font-size:13px}
nav button.on{color:var(--acc);font-weight:600}
.time{font-size:84px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:40px 0 8px}
.phase{text-align:center;color:var(--dim);text-transform:uppercase;letter-spacing:2px;font-size:13px}
.row{display:flex;gap:12px;justify-content:center;margin:24px 0}
.btn{background:var(--card);color:var(--fg);border:0;border-radius:14px;padding:14px 26px;font-size:17px}
.btn.p{background:var(--acc);color:#fff;font-weight:600}
.btn.s{padding:10px 16px;font-size:15px}
textarea,input[type=text]{width:100%;background:var(--card);color:var(--fg);border:0;border-radius:12px;padding:12px;font:inherit}
textarea{height:60vh;resize:none}
li{list-style:none;display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:12px;margin-top:8px}
li.d span{text-decoration:line-through;color:var(--dim)}li span{flex:1;cursor:pointer}
li.f{outline:2px solid var(--acc)}
li button{background:none;border:0;color:var(--dim);font-size:20px}
li b{font-weight:500}
li button.chip{background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px}
ul{padding:0;margin:0}
.now{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);margin-top:12px;min-height:32px;text-align:center}
.now button{background:none;border:0;color:var(--dim);font-size:20px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:16px 0}
.card form{display:flex;gap:8px;margin-top:10px}
.card input[type=text]{background:var(--bg);flex:1;min-width:0}
.wk{display:flex;align-items:center;justify-content:space-between}
#rv{height:40vh;margin-top:12px}
</style>
</head>
<body>
<section id="timer" class="on">
  <div class="phase" id="phase"></div>
  <div class="time" id="time"></div>
  <div class="phase" id="count"></div>
  <div class="now"><span id="now"></span><button id="nowx" aria-label="Clear task">×</button></div>
  <div class="row"><button class="btn p" id="go">Start</button><button class="btn" id="skip">Skip</button><button class="btn" id="reset">Reset</button></div>
  <div class="card" id="ask" hidden>What got done?
    <form id="af"><input type="text" id="ai" placeholder="One line" autocomplete="off"><button class="btn p s">Save</button><button type="button" class="btn s" id="askip">Skip</button></form>
  </div>
</section>
<section id="stopwatch">
  <div class="time" id="swt">0:00.0</div>
  <div class="row"><button class="btn p" id="swgo">Start</button><button class="btn" id="swreset">Reset</button></div>
</section>
<section id="tasks">
  <form id="tf" style="display:flex;gap:8px"><input type="text" id="ti" placeholder="Add a task" autocomplete="off"><input type="text" id="tg" list="tgl" placeholder="Client" autocomplete="off" style="width:32%;flex:none"><datalist id="tgl"></datalist><button class="btn p">+</button></form>
  <ul id="tl"></ul>
</section>
<section id="week">
  <div class="wk"><button class="btn s" id="wp" aria-label="Previous week">‹</button><b id="wl"></b><button class="btn s" id="wn" aria-label="Next week">›</button></div>
  <ul id="wb"></ul>
  <textarea id="rv" placeholder="Weekly review"></textarea>
  <div class="row" style="margin:12px 0"><button class="btn s p" id="cp">Copy review</button><button class="btn s" id="ex">Export backup</button><button class="btn s" id="imb">Import</button></div>
  <input type="file" id="im" accept=".json,application/json" hidden>
</section>
<section id="notes"><textarea id="nt" placeholder="Scratchpad…"></textarea></section>
<nav><button data-t="timer" class="on">Timer</button><button data-t="stopwatch">Stopwatch</button><button data-t="tasks">Tasks</button><button data-t="week">Week</button><button data-t="notes">Notes</button></nav>
<script>
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const arr=k=>{const v=load(k,[]);return Array.isArray(v)?v:[]};
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
try{navigator.storage?.persist?.()}catch{}

// data. normT/normS also run on old-format data, so existing tasks (no id/tag) migrate in place
const normT=t=>({id:t.id||uid(),x:String(t.x||''),d:!!t.d,g:String(t.g||'').trim()});
const normS=s=>({id:s.id||s.end,task:s.task||null,name:String(s.name||''),tag:String(s.tag||''),start:+s.start||0,end:+s.end,m:+s.m||25,note:String(s.note||'')});
let T=arr('tasks').map(normT);save('tasks',T);
let SS=arr('sessions').filter(s=>s&&+s.end>0).map(normS);

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on');
  if(b.dataset.t==='week')wdraw();
});

// pomodoro: stores an end timestamp so it stays correct when the app is backgrounded
const LEN={focus:25,short:5,long:15},NAME={focus:'Focus',short:'Short break',long:'Long break'};
let P={phase:'focus',left:0,end:null,task:null,ask:null,...load('pomo',{})};
delete P.done; // old never-resetting counter, now derived from the session log
if(!LEN[P.phase]){P.phase='focus';P.end=null}
if(!(P.left>0))P.left=LEN[P.phase]*60000;

// one shared AudioContext, unlocked by the Start tap (iOS blocks audio outside a user gesture)
let AC;
const audio=()=>{try{AC=AC||new AudioContext();if(AC.state!=='running')AC.resume()}catch{}};
const beep=()=>{try{const o=AC.createOscillator();o.connect(AC.destination);o.frequency.value=880;o.start();o.stop(AC.currentTime+.6)}catch{}};

const todayCount=()=>{const z=new Date().setHours(0,0,0,0);return SS.filter(s=>s.end>=z).length};
function next(long){
  P.phase=P.phase==='focus'?(long?'long':'short'):'focus';
  P.left=LEN[P.phase]*60000;P.end=null;
}
function finish(){
  const at=P.end,was=P.phase;
  if(was==='focus'){
    const t=T.find(t=>t.id===P.task);
    // end = scheduled end, not Date.now(), so a session that finished while the phone slept is logged at the right time
    SS.push(normS({id:at,task:t?.id,name:t?.x,tag:t?.g,start:at-LEN.focus*60000,end:at,m:LEN.focus}));
    save('sessions',SS);P.ask=at;
  }
  beep();
  if(document.hidden&&window.Notification&&Notification.permission==='granted')
    navigator.serviceWorker?.ready.then(r=>r.showNotification('Focus',{body:NAME[was]+' done'}));
  next(was==='focus'&&todayCount()%4===0);
  save('pomo',P);
}
function draw(){
  const ms=P.end?Math.max(0,P.end-Date.now()):P.left,s=Math.ceil(ms/1000);
  if(P.end&&ms===0){finish();return draw()}
  const t=T.find(t=>t.id===P.task);
  $('time').textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  $('phase').textContent=NAME[P.phase];
  $('count').textContent=todayCount()+' focus sessions today';
  $('now').textContent=t?'Now focusing on: '+t.x+(t.g?' · '+t.g:''):'No task picked. Tap one in Tasks.';
  $('nowx').hidden=!t;
  $('go').textContent=P.end?'Pause':'Start';
  document.title=P.end?$('time').textContent:'Focus';
  if($('ask').hidden===!!P.ask){$('ask').hidden=!P.ask;$('ai').value=''}
}
$('go').onclick=()=>{
  if(P.end){P.left=Math.max(0,P.end-Date.now());P.end=null}
  else{
    P.end=Date.now()+P.left;audio();
    if(window.Notification&&Notification.permission==='default')Notification.requestPermission();
  }
  save('pomo',P);draw();
};
// skipping a focus phase does not count as a completed session
$('skip').onclick=()=>{next(false);save('pomo',P);draw()};
$('reset').onclick=()=>{P.left=LEN[P.phase]*60000;P.end=null;save('pomo',P);draw()};
$('nowx').onclick=()=>{P.task=null;save('pomo',P);tdraw();draw()};
$('af').onsubmit=e=>{
  e.preventDefault();
  const s=SS.find(s=>s.id===P.ask);
  if(s){s.note=$('ai').value.trim();save('sessions',SS)}
  P.ask=null;save('pomo',P);draw();
};
$('askip').onclick=()=>{P.ask=null;save('pomo',P);draw()};

// stopwatch
let S=load('sw',{start:null,acc:0});
function swdraw(){
  const t=S.acc+(S.start?Date.now()-S.start:0),m=Math.floor(t/60000);
  $('swt').textContent=m+':'+pad(Math.floor(t/1000)%60)+'.'+Math.floor(t/100)%10;
  $('swgo').textContent=S.start?'Stop':'Start';
}
$('swgo').onclick=()=>{S.start?(S.acc+=Date.now()-S.start,S.start=null):S.start=Date.now();save('sw',S);swdraw()};
$('swreset').onclick=()=>{S={start:null,acc:0};save('sw',S);swdraw()};

// tasks
const unfocus=id=>{if(P.task===id){P.task=null;save('pomo',P)}};
function tdraw(){
  $('tl').innerHTML='';
  $('tgl').replaceChildren(...[...new Set(T.map(t=>t.g).filter(Boolean))].map(g=>{const o=document.createElement('option');o.value=g;return o}));
  T.forEach((t,i)=>{
    const li=document.createElement('li');li.className=(t.d?'d ':'')+(t.id===P.task?'f':'');
    const c=document.createElement('input');c.type='checkbox';c.checked=t.d;c.onchange=()=>{t.d=c.checked;if(t.d)unfocus(t.id);save('tasks',T);tdraw();draw()};
    const s=document.createElement('span');s.textContent=t.x;
    s.onclick=()=>{P.task=P.task===t.id?null:t.id;save('pomo',P);tdraw();draw()};
    const g=document.createElement('button');g.className='chip';g.textContent=t.g||'+ client';
    g.onclick=()=>{const v=prompt('Client / project',t.g);if(v!==null){t.g=v.trim();save('tasks',T);tdraw();draw()}};
    const x=document.createElement('button');x.textContent='×';x.onclick=()=>{unfocus(t.id);T.splice(i,1);save('tasks',T);tdraw();draw()};
    li.append(c,s,g,x);$('tl').append(li);
  });
}
$('tf').onsubmit=e=>{e.preventDefault();const x=$('ti').value.trim();if(x){T.push(normT({x,g:$('tg').value}));$('ti').value='';save('tasks',T);tdraw()}};

// week: breakdown per client + exportable review. Weeks start Monday, local time
let wk=0;
const fmt=m=>(m>=60?Math.floor(m/60)+'h ':'')+m%60+'m';
const D=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
function weekOf(){
  const a=new Date();a.setHours(0,0,0,0);a.setDate(a.getDate()-(a.getDay()+6)%7+wk*7);
  const b=new Date(a);b.setDate(b.getDate()+7);
  return {a,b,W:SS.filter(s=>s.end>=a&&s.end<b).sort((x,y)=>x.end-y.end)};
}
const agg=W=>{
  const by={};
  W.forEach(s=>{(by[s.tag.toLowerCase()]=by[s.tag.toLowerCase()]||{n:s.tag||'No client',m:0}).m+=s.m});
  return Object.values(by).sort((x,y)=>y.m-x.m);
};
function review({a,b,W}){
  if(!W.length)return 'No focus sessions this week.';
  const out=['Week of '+D(a)+' to '+D(new Date(b-1)),'Focus: '+fmt(W.reduce((n,s)=>n+s.m,0))+' ('+W.length+' sessions)','','By client:'];
  agg(W).forEach(v=>out.push('- '+v.n+': '+fmt(v.m)));
  out.push('','Done:');
  let cur='';
  W.forEach(s=>{
    const x=s.note||s.name;if(!x)return;
    const d=new Date(s.end).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    if(d!==cur){out.push('',d);cur=d}
    const l='- '+(s.tag?'['+s.tag+'] ':'')+x;
    if(l!==out[out.length-1])out.push(l);
  });
  return out.join('\n');
}
function wdraw(){
  const w=weekOf();
  $('wl').textContent=D(w.a)+' to '+D(new Date(w.b-1));
  $('wb').replaceChildren(...agg(w.W).map(v=>{
    const li=document.createElement('li'),s=document.createElement('span'),m=document.createElement('b');
    s.textContent=v.n;m.textContent=fmt(v.m);li.append(s,m);return li;
  }));
  $('rv').value=review(w);
}
$('wp').onclick=()=>{wk--;wdraw()};
$('wn').onclick=()=>{if(wk<0){wk++;wdraw()}};
$('cp').onclick=async()=>{
  try{await navigator.clipboard.writeText($('rv').value)}catch{$('rv').select();document.execCommand('copy')}
  $('cp').textContent='Copied';setTimeout(()=>$('cp').textContent='Copy review',1200);
};

// backup
$('ex').onclick=async()=>{
  const f=new File([JSON.stringify({app:'focus',v:1,at:Date.now(),tasks:T,notes:$('nt').value,sessions:SS},null,1)],
    'focus-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
  try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1e4);
};
$('imb').onclick=()=>$('im').click();
$('im').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(j.app!=='focus'||!Array.isArray(j.tasks)||!Array.isArray(j.sessions))throw 0;
    if(!confirm('Replace current tasks, notes and sessions with this backup?'))return;
    T=j.tasks.map(normT);SS=j.sessions.filter(s=>s&&+s.end>0).map(normS);
    $('nt').value=String(j.notes||'');P.task=P.ask=null;
    save('tasks',T);save('sessions',SS);save('notes',$('nt').value);save('pomo',P);
    tdraw();draw();wdraw();
  }catch{alert('Not a Focus backup file.')}
};

// notes
$('nt').value=load('notes','');
$('nt').oninput=()=>save('notes',$('nt').value);

draw();swdraw();tdraw();
setInterval(()=>{draw();swdraw()},200);
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // a new worker took over: reload once so the new index.html runs (timer is timestamp-based, safe)
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()});
}
</script>
</body>
</html>
